<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluxer Forge Setup</title>
    <meta
      name="description"
      content="Pick Fluxer bot modules, generate a config.toml, download a ready-to-run archive. No accounts, no hosting, no backend."
    />
    <meta name="theme-color" content="#008080" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="window">
      <div class="titlebar">
        <span class="title">Fluxer Forge Setup</span>
        <span class="title-btns" aria-hidden="true"><i></i><i></i><i class="close"></i></span>
      </div>

      <div class="pages">
        <aside class="sidebar">
          <div class="banner">
            <span class="banner-name">Fluxer<br />Forge</span>
            <span class="banner-sub">Bot Setup</span>
          </div>
          <nav class="stepper" id="stepper" aria-label="Steps"></nav>
        </aside>

        <div class="page">
          <section class="card">
            <div id="card-content"></div>
          </section>
          <p class="below">
            Fluxer has no slash commands or interactions, so modules speak prefix commands and
            reactions. See the
            <a href="https://docs.fluxer.app" target="_blank" rel="noreferrer">Fluxer docs</a>.
          </p>
        </div>
      </div>

      <div class="card-foot">
        <span class="foot-note mono dim" id="foot-note"></span>
        <button type="button" class="btn" id="btn-back">&lt; Back</button>
        <span class="btn-spacer" id="btn-spacer" hidden></span>
        <button type="button" class="btn primary" id="btn-next">Next &gt;</button>
      </div>
    </div>

    <script src="js/zip.js"></script>
    <script src="js/modules.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/toml.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
